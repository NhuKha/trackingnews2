<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Signal Radar</title><style>
body{font-family:system-ui,-apple-system,sans-serif;background:#0b0e14;color:#e8edf4;margin:0}main{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px}.muted{color:#8c98aa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-top:22px}.card{background:#121722;border:1px solid #242c3b;border-radius:14px;padding:18px}.score{font-size:34px;font-weight:750}.ticker{font-size:20px;font-weight:700}.tag{font-size:12px;padding:4px 8px;border:1px solid #39445a;border-radius:999px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.bar{height:7px;background:#242c3b;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#8aa4ff}.summary{font-size:14px;line-height:1.45;color:#bdc7d7;margin-top:12px}button{background:#e8edf4;color:#0b0e14;border:0;border-radius:8px;padding:9px 12px;font-weight:650;cursor:pointer}</style></head>
<body><main><div class="top"><div><h1>Market Radar</h1><div class="muted">Evidence strength across social, market, insider, whale and trusted-news signals.</div></div><div style="display:flex;gap:8px"><button onclick="load()">Refresh</button><button onclick="logout()">Log out</button></div></div><div id="status" class="muted" style="margin-top:16px"></div><div id="grid" class="grid"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function metric(k,v){return `<div class="row"><span class="muted">${k}</span><b>${Math.round(v||0)}</b></div><div class="bar"><span style="width:${Math.min(100,v||0)}%"></span></div>`}
async function load(){const status=document.getElementById('status'),grid=document.getElementById('grid');status.textContent='Loading…';try{const r=await fetch('/api/v1/radar?limit=50');const d=await r.json();grid.innerHTML=d.map(x=>`<article class="card"><div class="row"><div><span class="ticker">${esc(x.ticker)}</span> <span class="tag">${esc(x.level)}</span><div class="muted">${esc(x.company_name)}</div></div><div class="score">${Math.round(x.signal_score)}</div></div>${metric('X / social',x.x_score)}${metric('Market',x.market_score)}${metric('Insider',x.insider_score)}${metric('News',x.news_score)}${metric('Whale',x.whale_score)}${metric('Verification',x.verification_score)}<div class="summary">${esc(x.summary||'No summary yet.')}</div></article>`).join('');status.textContent=d.length?`${d.length} signals`:'No signals yet. Add a company, ingest data, then recompute its signal.'}catch(e){status.textContent='Could not load radar: '+e}}
async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}
load();</script></body></html>
