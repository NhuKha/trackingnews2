services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stocksignal
      POSTGRES_USER: stocksignal
      POSTGRES_PASSWORD: stocksignal
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://stocksignal:stocksignal@db:5432/stocksignal
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
